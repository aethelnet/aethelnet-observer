<!DOCTYPE html>
<html lang="en">
<head>
    <script>
      window.addEventListener('error', function(e) {
        if (e.filename && (e.filename.startsWith('chrome-extension://') || e.filename.startsWith('moz-extension://'))) {
          console.warn('[Extension Ignored]', e.message, e.filename);
          return;
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && typeof e.reason === 'string' && (e.reason.includes('extension') || e.reason.includes('ethereum'))) {
          console.warn('[Extension Rejection Ignored]', e.reason);
          return;
        }
      });
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="LGNN Hub">
    <title>Aethelnet Observer | On-Chain Consensus Lens</title>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
